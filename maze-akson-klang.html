<!-- สไตล์ตกแต่งใบงานใหม่เวอร์ชันแก้บั๊ก สไตล์ KruDurian -->
<style>
  .kru-container {
    font-family: 'Kanit', 'ChulaCharasNew', 'Sarabun', sans-serif;
    max-width: 600px;
    margin: 20px auto;
    padding: 20px;
    background-color: #f9f9f9;
    border: 3px solid #ffcc00;
    border-radius: 15px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    text-align: center;
  }
  .kru-title { color: #d32f2f; margin-bottom: 5px; }
  .kru-instruction { color: #555; font-size: 16px; margin-bottom: 15px; }
  
  /* สไตล์ตารางเขาวงกต - ปรับความชัดเจนของตัวอักษร */
  .maze-table {
    margin: 20px auto;
    border-collapse: separate;
    border-spacing: 6px;
  }
  .maze-cell {
    width: 52px;
    height: 52px;
    border: 2px solid #ccc;
    border-radius: 8px;
    font-size: 24px; /* ขยายขนาดให้อ่านง่าย */
    font-weight: 500; /* ปรับความหนาให้พอดี ไม่หนาเกินไปจนแยก ด ต ไม่ออก */
    cursor: pointer;
    background-color: #fff;
    user-select: none;
    transition: all 0.2s;
    color: #333;
  }
  .maze-cell:hover { background-color: #f0f0f0; }
  /* ช่องที่ไก่เดินผ่านมาแล้ว */
  .maze-cell.visited { background-color: #ffeb3b; border-color: #fbc02d; }
  /* ช่องปัจจุบันที่ไก่อยู่ */
  .maze-cell.chicken-here { font-size: 28px; background-color: #fff9c4; border-color: #ffb300; }
  .maze-cell.end { font-size: 28px; background-color: #e8f5e9; }

  /* ปุ่มควบคุม */
  .btn-group { margin-top: 20px; }
  .kru-btn {
    padding: 10px 20px;
    font-size: 16px;
    font-weight: bold;
    border: none;
    border-radius: 25px;
    margin: 5px;
    cursor: pointer;
    transition: 0.2s;
  }
  .btn-reset { background-color: #f44336; color: white; }
  .btn-random { background-color: #2196f3; color: white; }
  .kru-btn:hover { opacity: 0.9; transform: scale(1.05); }
  
  /* กล่องแจ้งเตือนแทน Alert แบบเก่าเพื่อแก้ปัญหาภาษาต่างดาว */
  #kru-alert {
    font-size: 18px;
    font-weight: bold;
    color: #cc0000;
    margin-top: 15px;
    min-height: 25px;
  }
  
  /* แสดงผลคะแนน */
  #score-board {
    font-size: 22px;
    font-weight: bold;
    margin-top: 15px;
    color: #2e7d32;
    display: none;
  }
</style>

<div class="kru-container">
  <h2 class="kru-title">🐔 เกมใบงานเขาวงกต: พาแม่ไก่เดินตามล่าอักษรกลาง</h2>
  <p class="kru-instruction"><strong>วิธีเล่น:</strong> คลิกช่อง <strong>"อักษรกลาง" (ก จ ฎ ฏ ด ต บ ป อ)</strong> ที่อยู่ติดกับตัวไก่เพื่อนำทางไปกินข้าวโพด 🌽</p>

  <!-- ตารางเขาวงกต 8x8 -->
  <table class="maze-table" id="maze"></table>

  <!-- กล่องแสดงข้อความแจ้งเตือนเด็กๆ แก้ปัญหาอักษรต่างดาว -->
  <div id="kru-alert"></div>

  <!-- ปุ่มฟังก์ชันใช้งาน -->
  <div class="btn-group">
    <button class="kru-btn btn-reset" onclick="resetMaze()">🔄 เริ่มเดินใหม่ตั้งแต่ต้น</button>
    <button class="kru-btn btn-random" onclick="generateMaze()">🔀 สุ่มเปลี่ยนตัวอักษรใหม่</button>
  </div>

  <div id="score-board"></div>
</div>

<script>
// คลังอักษรสามหมู่ของครูทุเรียน
const middleLetters = ['ก', 'จ', 'ฎ', 'ฏ', 'ด', 'ต', 'บ', 'ป', 'อ'];
const otherLetters = ['ข', 'ฃ', 'ฉ', 'ฐ', 'ถ', 'ผ', 'ฝ', 'ศ', 'ษ', 'ส', 'ห', 'ค', 'ง', 'ช', 'ซ', 'ญ', 'ย', 'น', 'ท', 'พ', 'ฟ', 'ม', 'ร', 'ล', 'ว'];

// คลังรูปแบบเส้นทางเดินเขาวงกต 8x8 (เปลี่ยนรูปทรงไม่ให้ซ้ำเดิม)
const pathTemplates = [
  ["0,1", "1,1", "1,2", "1,3", "2,3", "2,4", "3,4", "3,5", "4,5", "4,6", "5,6", "6,6", "7,6"],
  ["1,0", "2,0", "2,1", "2,2", "3,2", "4,2", "4,3", "5,3", "5,4", "5,5", "6,5", "7,5", "7,6"],
  ["0,1", "0,2", "0,3", "1,3", "2,3", "3,3", "3,4", "3,5", "4,5", "5,5", "6,5", "6,6", "6,7"],
  ["1,0", "1,1", "2,1", "2,2", "3,2", "3,3", "4,3", "4,4", "5,4", "5,5", "6,5", "6,6", "7,6"],
  ["0,1", "0,2", "0,3", "0,4", "1,4", "2,4", "3,4", "4,4", "4,5", "4,6", "5,6", "6,6", "7,6"]
];

let currentPath = [];
let chickenPos = { r: 0, c: 0 };
let mazeData = {}; 

function getRandomLetter(list) {
  return list[Math.floor(Math.random() * list.length)];
}

function showAlert(message) {
  const alertDiv = document.getElementById('kru-alert');
  alertDiv.innerHTML = message;
  // ล้างข้อความเตือนอัตโนมัติหลังจากผ่านไป 3 วินาที
  setTimeout(() => {
    if(alertDiv.innerHTML === message) alertDiv.innerHTML = '';
  }, 3000);
}

function generateMaze() {
  const table = document.getElementById('maze');
  table.innerHTML = '';
  document.getElementById('score-board').style.display = 'none';
  document.getElementById('kru-alert').innerHTML = '';
  chickenPos = { r: 0, c: 0 };
  mazeData = {};

  currentPath = pathTemplates[Math.floor(Math.random() * pathTemplates.length)];

  for (let r = 0; r < 8; r++) {
    let row = table.insertRow();
    for (let c = 0; c < 8; c++) {
      let cell = row.insertCell();
      cell.className = 'maze-cell';
      cell.id = `cell-${r}-${c}`;
      cell.dataset.row = r;
      cell.dataset.col = c;

      cell.addEventListener('click', function() {
        moveChicken(parseInt(this.dataset.row), parseInt(this.dataset.col));
      });

      if (r === 0 && c === 0) {
        cell.innerHTML = '🐔';
        cell.className += ' chicken-here';
      } else if (r === 7 && c === 7) {
        cell.innerHTML = '🌽';
        cell.className += ' end';
      } else {
        let letter = currentPath.includes(`${r},${c}`) ? getRandomLetter(middleLetters) : getRandomLetter(otherLetters);
        cell.innerHTML = letter;
        mazeData[`${r},${c}`] = letter;
      }
    }
  }
}

function moveChicken(targetR, targetC) {
  if (targetR === chickenPos.r && targetC === chickenPos.c) return;

  let rowDiff = Math.abs(targetR - chickenPos.r);
  let colDiff = Math.abs(targetC - chickenPos.c);
  let isAdjacent = (rowDiff + colDiff === 1);

  if (!isAdjacent) {
    showAlert("📢 แม่ไก่กระโดดข้ามช่องไม่ได้นะจ๊ะ ต้องเลือกช่องที่อยู่ติดกันจ้า");
    return;
  }

  let isCorn = (targetR === 7 && targetC === 7);
  let targetLetter = mazeData[`${targetR},${targetC}`];
  let isMiddleLetter = middleLetters.includes(targetLetter);

  if (isMiddleLetter || isCorn) {
    document.getElementById('kru-alert').innerHTML = '';
    let oldCell = document.getElementById(`cell-${chickenPos.r}-${chickenPos.c}`);
    oldCell.innerHTML = "";
    oldCell.classList.remove('chicken-here');
    oldCell.classList.add('visited');

    chickenPos.r = targetR;
    chickenPos.c = targetC;

    let newCell = document.getElementById(`cell-${targetR}-${targetC}`);
    if (isCorn) {
      newCell.innerHTML = '🐔🌽';
      newCell.classList.remove('end');
      newCell.classList.add('chicken-here');
      gameWin();
    } else {
      newCell.innerHTML = '🐔';
      newCell.classList.add('chicken-here');
    }
  } else {
    showAlert(`❌ ตัวอักษร "${targetLetter}" ไม่ใช่อักษรกลาง แม่ไก่เดินผ่านไม่ได้จ้า!`);
  }
}

function gameWin() {
  const scoreBoard = document.getElementById('score-board');
  scoreBoard.innerHTML = `🏆 ยินดีด้วยจ้า! แม่ไก่ได้กินข้าวโพดแสนอร่อยแล้ว <br> รับคะแนนเต็ม 10 / 10 คะแนน! 🎉`;
  scoreBoard.style.display = 'block';
  scoreBoard.scrollIntoView({ behavior: 'smooth' });
}

function resetMaze() {
  generateMaze();
}

window.onload = generateMaze;
</script>
