<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เกมจับคู่การชั่งน้ำหนัก ป.1</title>
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #f0fdf4;
            color: #1e293b;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 850px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #16a34a;
            font-size: 2.2rem;
            margin-bottom: 10px;
        }
        .subtitle {
            font-size: 1.1rem;
            color: #475569;
            margin-bottom: 30px;
        }
        .game-area {
            display: flex;
            justify-content: space-between;
            position: relative;
            margin-bottom: 30px;
            gap: 140px; /* เพิ่มช่องว่างตรงกลางให้เห็นเส้นชัดเจนขึ้น */
            padding: 10px 0;
        }
        #line-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        .connection-line {
            stroke: #16a34a;
            stroke-width: 6;
            stroke-linecap: round;
            opacity: 0.9;
        }
        .column {
            display: flex;
            flex-direction: column;
            gap: 20px;
            flex: 1;
            z-index: 2;
        }
        .item {
            background-color: #f8fafc;
            border: 3px solid #cbd5e1;
            padding: 20px 10px;
            border-radius: 15px;
            font-size: 1.25rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        .item:hover {
            border-color: #22c55e;
            background-color: #f0fdf4;
        }
        /* บังคับสีปุ่มที่ถูกเลือกให้ชัดเจน */
        .item.selected {
            background-color: #bbf7d0 !important;
            border-color: #22c55e !important;
            color: #15803d !important;
        }
        .item.matched {
            background-color: #f1f5f9 !important;
            border-color: #cbd5e1 !important;
            color: #94a3b8 !important;
            cursor: default;
        }
        .btn {
            background-color: #22c55e;
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(34, 197, 94, 0.4);
        }
        .score-board {
            font-size: 1.5rem;
            font-weight: bold;
            margin-top: 20px;
            color: #16a34a;
        }
        .popup {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
            z-index: 10;
            width: 80%;
            max-width: 400px;
        }
        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 5;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>⚖️ เกมจับคู่การชั่งน้ำหนัก ป.1</h1>
    <div class="subtitle">คำชี้แจง: คลิกเลือกน้ำหนักฝั่งซ้าย 1 ช่อง และฝั่งขวา 1 ช่องที่มีค่าเท่ากันเพื่อโยงเส้นให้ถูกต้อง!</div>

    <div class="game-area" id="game-area">
        <svg id="line-svg"></svg>
        <div class="column" id="left-column"></div>
        <div class="column" id="right-column"></div>
    </div>

    <div class="score-board" id="score-text">คะแนน: 0 / 4</div>
    <button class="btn" style="margin-top: 20px; background-color: #64748b;" onclick="resetGame()">เริ่มเกมใหม่</button>
</div>

<div class="overlay" id="overlay"></div>
<div class="popup" id="win-popup">
    <h2>🎉 เก่งมากเลย! 🎉</h2>
    <p style="font-size: 1.2rem;">หนูๆ โยงเส้นจับคู่ถูกต้องทั้งหมดแล้วค่ะ/ครับ</p>
    <button class="btn" onclick="resetGame()">เล่นอีกครั้ง</button>
</div>
<script>
    // อัปเดตโจทย์แบบผสมน้ำหนัก (กิโลกรัม ขีด กรัม) สำหรับเด็ก ป.1
    const data = [
        { id: 1, left: "1 กิโลกรัม 3 ขีด", right: "1 กิโลกรัม 300 กรัม" },
        { id: 2, left: "2 กิโลกรัม 500 กรัม", right: "2 กิโลกรัม ครึ่ง" },
        { id: 3, left: "4 กิโลกรัม 8 ขีด", right: "4,800 กรัม" },
        { id: 4, left: "500 กรัม", right: "5 ขีด" }
    ];

    let selectedLeft = null;
    let selectedRight = null;
    let score = 0;

    function shuffle(array) {
        return array.sort(() => Math.random() - 0.5);
    }

    function initGame() {
        const leftCol = document.getElementById('left-column');
        const rightCol = document.getElementById('right-column');
        const svg = document.getElementById('line-svg');
        
        leftCol.innerHTML = '';
        rightCol.innerHTML = '';
        svg.innerHTML = ''; 
        
        score = 0;
        selectedLeft = null;
        selectedRight = null;
        document.getElementById('score-text').innerText = `คะแนน: ${score} / ${data.length}`;
        document.getElementById('win-popup').style.display = 'none';
        document.getElementById('overlay').style.display = 'none';

        const leftItems = shuffle([...data]);
        const rightItems = shuffle([...data]);

        leftItems.forEach(item => {
            const div = document.createElement('div');
            div.className = 'item';
            div.innerText = item.left;
            div.dataset.id = item.id;
            div.onclick = () => selectLeft(div);
            leftCol.appendChild(div);
        });

        rightItems.forEach(item => {
            const div = document.createElement('div');
            div.className = 'item';
            div.innerText = item.right;
            div.dataset.id = item.id;
            div.onclick = () => selectRight(div);
            rightCol.appendChild(div);
        });
    }

    function selectLeft(element) {
        if (element.classList.contains('matched')) return;
        
        // ล้างสีไฮไลต์ของกล่องอื่นทั้งหมดในฝั่งซ้าย เพื่อบังคับเลือกได้ทีละ 1 ช่อง
        const allLeftItems = document.querySelectorAll('#left-column .item');
        allLeftItems.forEach(item => item.classList.remove('selected'));
        
        selectedLeft = element;
        selectedLeft.classList.add('selected');
        checkMatch();
    }

    function selectRight(element) {
        if (element.classList.contains('matched')) return;
        
        // ล้างสีไฮไลต์ของกล่องอื่นทั้งหมดในฝั่งขวา เพื่อบังคับเลือกได้ทีละ 1 ช่อง
        const allRightItems = document.querySelectorAll('#right-column .item');
        allRightItems.forEach(item => item.classList.remove('selected'));

        selectedRight = element;
        selectedRight.classList.add('selected');
        checkMatch();
    }

    function drawConnection(leftEl, rightEl) {
        const svg = document.getElementById('line-svg');
        const gameArea = document.getElementById('game-area');
        
        const gameAreaRect = gameArea.getBoundingClientRect();
        const leftRect = leftEl.getBoundingClientRect();
        const rightRect = rightEl.getBoundingClientRect();

        // คำนวณพิกัดจากตำแหน่งจริงบนจอเทียบกับกรอบพื้นที่เกม เพื่อป้องกันเส้นเยื้อง
        const x1 = leftRect.right - gameAreaRect.left;
        const y1 = (leftRect.top + (leftRect.height / 2)) - gameAreaRect.top;
        
        const x2 = rightRect.left - gameAreaRect.left;
        const y2 = (rightRect.top + (rightRect.height / 2)) - gameAreaRect.top;

        const line = document.createElementNS("http://w3.org", "line");
        line.setAttribute("x1", x1);
        line.setAttribute("y1", y1);
        line.setAttribute("x2", x2);
        line.setAttribute("y2", y2);
        line.setAttribute("class", "connection-line");
        
        svg.appendChild(line);
    }

    function checkMatch() {
        if (selectedLeft && selectedRight) {
            if (selectedLeft.dataset.id === selectedRight.dataset.id) {
                // จับคู่ถูก -> วาดเส้นทันที และเปลี่ยนสถานะเป็น matched
                drawConnection(selectedLeft, selectedRight);

                selectedLeft.classList.remove('selected');
                selectedRight.classList.remove('selected');
                selectedLeft.classList.add('matched');
                selectedRight.classList.add('matched');
                
                score++;
                document.getElementById('score-text').innerText = `คะแนน: ${score} / ${data.length}`;
                
                selectedLeft = null;
                selectedRight = null;

                if (score === data.length) {
                    setTimeout(() => {
                        document.getElementById('win-popup').style.display = 'block';
                        document.getElementById('overlay').style.display = 'block';
                    }, 500);
                }
            } else {
                // ถ้าจับคู่ผิด ให้เคลียร์สีไฮไลต์ออกใน 0.3 วินาที เพื่อให้เลือกใหม่
                const wrongLeft = selectedLeft;
                const wrongRight = selectedRight;
                setTimeout(() => {
                    if (wrongLeft && !wrongLeft.classList.contains('matched')) wrongLeft.classList.remove('selected');
                    if (wrongRight && !wrongRight.classList.contains('matched')) wrongRight.classList.remove('selected');
                }, 300);
                selectedLeft = null;
                selectedRight = null;
            }
        }
    }

    function resetGame() {
        initGame();
    }

    // วาดเส้นใหม่เมื่อจอมีการเปลี่ยนขนาดหรือย่อขยาย
    window.addEventListener('resize', () => {
        const svg = document.getElementById('line-svg');
        svg.innerHTML = '';
        const matchedLefts = document.querySelectorAll('#left-column .item.matched');
        matchedLefts.forEach(leftEl => {
            const id = leftEl.dataset.id;
            const rightEl = document.querySelector(`#right-column .item.matched[data-id="${id}"]`);
            if (rightEl) {
                drawConnection(leftEl, rightEl);
            }
        });
    });

    window.onload = initGame;
</script>
</body>
</html>
