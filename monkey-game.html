<div class="monkey-game-container">
    <!-- ส่วนหัวเกม -->
    <div class="game-header">
        <h2>🍌 เกมลิงจ๋อตามล่าหาตัวไม่ทราบค่า 🐒</h2>
        <p>ฝึกทักษะการหาตัวเลขที่หายไป ไม่เกิน 20 (ตอบถูกเพื่อเปิดทาง)</p>
    </div>

    <!-- ฉากการเดินทาง (Visual Map) -->
    <div class="game-scene">
        <div class="path-grid" id="monkey-path">
            <!-- จุดเริ่มต้น: ลิง -->
            <div class="path-cell start-cell" id="mcell-0">🐒</div>
            <!-- ทางเดินที่ถูกปิดไว้ด้วยก้อนหิน -->
            <div class="path-cell locked" id="mcell-1">🪨</div>
            <div class="path-cell locked" id="mcell-2">🪨</div>
            <div class="path-cell locked" id="mcell-3">🪨</div>
            <div class="path-cell locked" id="mcell-4">🪨</div>
            <!-- จุดหมาย: กล้วย -->
            <div class="path-cell target-cell" id="mcell-5">🍌</div>
        </div>
    </div>

    <!-- กล่องโจทย์คำถามอินเตอร์แอคทีฟ -->
    <div class="quiz-box">
        <div class="level-indicator">ก้าวที่เอาชนะ: <span id="monkey-step">0</span> / 5</div>
        <div class="math-question" id="monkey-question">กำลังสร้างโจทย์ปริศนา...</div>
        
        <!-- ช่องใส่คำตอบสำหรับเด็กๆ -->
        <div class="answer-zone">
            <input type="number" id="monkey-answer" placeholder="เติมเลขในช่องว่าง" min="0" max="20" autofocus>
            <button type="button" class="submit-btn" onclick="checkMonkeyAnswer()">ส่งคำตอบ 🌟</button>
        </div>
        
        <!-- ข้อความแจ้งสถานะและปุ่มเริ่มใหม่ -->
        <div id="monkey-feedback" class="game-feedback"></div>
        <div id="monkey-victory" style="display:none; text-align:center; margin-top:15px;">
            <button type="button" class="restart-btn" onclick="resetMonkeyGame()">เล่นใหม่อีกครั้ง 🔄</button>
        </div>
    </div>
</div>

<!-- ระบบควบคุมเกมลิงจ๋อและสุ่มโจทย์ตัวไม่ทราบค่า -->
<script>
let monkeyStep = 0;
const mTotalSteps = 5;
let mNum1 = 0;
let mNum2 = 0;
let mOperator = '+';
let mAnswer = 0;

// ฟังก์ชันสุ่มโจทย์หาตัวไม่ทราบค่า ไม่เกิน 20
function generateMonkeyQuestion() {
    mOperator = Math.random() > 0.5 ? '+' : '-';
    let total = 0;
    let part1 = 0;
    let part2 = 0;

    if (mOperator === '+') {
        // การบวก: ผลรวมไม่เกิน 20
        total = Math.floor(Math.random() * 16) + 5; // 5 ถึง 20
        part1 = Math.floor(Math.random() * (total - 1)) + 1;
        part2 = total - part1;

        // สุ่มรูปแบบคำถาม 2 แบบ
        if (Math.random() > 0.5) {
            // แบบที่ 1: [⬜] + 5 = 12
            mAnswer = part1;
            document.getElementById('monkey-question').innerHTML = `⬜ + ${part2} = ${total}`;
        } else {
            // แบบที่ 2: 7 + [⬜] = 15
            mAnswer = part2;
            document.getElementById('monkey-question').innerHTML = `${part1} + ⬜ = ${total}`;
        }
    } else {
        // การลบ: ตัวตั้งไม่เกิน 20
        part1 = Math.floor(Math.random() * 16) + 5; // ตัวตั้ง (5 ถึง 20)
        total = Math.floor(Math.random() * part1);   // ผลลัพธ์
        part2 = part1 - total;                       // ตัวลบ

        // สุ่มรูปแบบคำถาม 2 แบบ
        if (Math.random() > 0.5) {
            // แบบที่ 1: [⬜] - 4 = 8
            mAnswer = part1;
            document.getElementById('monkey-question').innerHTML = `⬜ - ${part2} = ${total}`;
        } else {
            // แบบที่ 2: 14 - [⬜] = 6
            mAnswer = part2;
            document.getElementById('monkey-question').innerHTML = `${part1} - ⬜ = ${total}`;
        }
    }

    document.getElementById('monkey-answer').value = '';
    document.getElementById('monkey-answer').focus();
}

// ฟังก์ชันตรวจคำตอบ
function checkMonkeyAnswer() {
    const uAns = parseInt(document.getElementById('monkey-answer').value);
    const feedback = document.getElementById('monkey-feedback');
    
    if (isNaN(uAns)) {
        feedback.innerHTML = "⚠️ หนูๆ อย่าลืมพิมพ์ตัวเลขในช่องว่างนะจ๊ะ";
        feedback.className = "game-feedback warning";
        return;
    }

    if (uAns === mAnswer) {
        monkeyStep++;
        feedback.innerHTML = "🎉 ถูกต้องยอดเยี่ยม! 🐒 ลิงจ๋อกระโดดข้ามก้อนหินแล้ว!";
        feedback.className = "game-feedback success";
        
        updateMonkeyMap();
        
        if (monkeyStep >= mTotalSteps) {
            endMonkeyGame();
        } else {
            setTimeout(generateMonkeyQuestion, 1500);
        }
    } else {
        feedback.innerHTML = "❌ ยังไม่ถูกจ้า ลองคิดเลขใหม่อีกทีนะคนเก่ง";
        feedback.className = "game-feedback error";
    }
}

// ฟังก์ชันอัปเดตแมพและการเคลื่อนที่ของลิง
function updateMonkeyMap() {
    document.getElementById('monkey-step').innerText = monkeyStep;
    
    const prevCell = document.getElementById(`mcell-${monkeyStep - 1}`);
    if (prevCell) prevCell.innerHTML = "🟩";

    const currentCell = document.getElementById(`mcell-${monkeyStep}`);
    if (currentCell) {
        currentCell.innerHTML = "🐒";
        currentCell.className = "path-cell m-active-path";
    }
}

// ฟังก์ชันเมื่อชนะเกม
function endMonkeyGame() {
    document.getElementById('monkey-question').innerHTML = "🥳 เย้! ลิงจ๋อเดินทางมาถึงต้นกล้วยและได้กินกล้วยแสนอร่อยแล้ว! 🍌🐒✨";
    document.getElementById('monkey-answer').style.display = 'none';
    document.querySelector('.monkey-game-container .submit-btn').style.display = 'none';
    document.getElementById('monkey-victory').style.display = 'block';
    
    document.getElementById(`mcell-${mTotalSteps}`).innerHTML = "🐒🍌";
}

// ฟังก์ชันรีเซ็ตเกมใหม่
function resetMonkeyGame() {
    monkeyStep = 0;
    document.getElementById('monkey-step').innerText = monkeyStep;
    document.getElementById('monkey-answer').style.display = 'inline-block';
    document.querySelector('.monkey-game-container .submit-btn').style.display = 'inline-block';
    document.getElementById('monkey-victory').style.display = 'none';
    document.getElementById('monkey-feedback').innerHTML = '';
    
    document.getElementById('mcell-0').innerHTML = "🐒";
    document.getElementById('mcell-0').className = "path-cell start-cell";
    
    for (let i = 1; i < mTotalSteps; i++) {
        document.getElementById(`mcell-${i}`).innerHTML = "🪨";
        document.getElementById(`mcell-${i}`).className = "path-cell locked";
    }
    
    document.getElementById(`mcell-${mTotalSteps}`).innerHTML = "🍌";
    document.getElementById(`mcell-${mTotalSteps}`).className = "path-cell target-cell";
    
    generateMonkeyQuestion();
}

// รันเกมเมื่อหน้าเว็บพร้อม
setTimeout(resetMonkeyGame, 300);
</script>
