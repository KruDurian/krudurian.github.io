<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pentagon Math Solver</title>
    <style>
        body { font-family: sans-serif; background-color: #f0f4f8; margin: 0; padding: 20px; text-align: center; user-select: none; }
        .game-container { max-width: 600px; margin: 10px auto; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 8px 16px rgba(0,0,0,0.1); }
        h1 { color: #1565c0; margin-bottom: 5px; font-size: 1.8rem; }
        .instructions { color: #555; font-size: 0.95rem; margin-bottom: 25px; line-height: 1.5; }
        .pentagon-area { position: relative; width: 320px; height: 320px; margin: 0 auto 30px auto; background-color: #fafafa; border-radius: 50%; border: 2px dashed #cfd8dc; }
        .pentagon-shape { position: absolute; width: 180px; height: 180px; background: #e3f2fd; clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%); top: 70px; left: 70px; border: 2px solid #90caf9; z-index: 1; }
        .corner-btn { position: absolute; width: 65px; height: 65px; background-color: #2196f3; color: white; border-radius: 50%; font-size: 1.6rem; font-weight: bold; display: flex; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 4px 8px rgba(0,0,0,0.2); transition: 0.2s; z-index: 10; border: 3px solid white; -webkit-tap-highlight-color: transparent; }
        .corner-btn:active { transform: scale(0.9); }
        .corner-btn.correct { background-color: #4caf50 !important; box-shadow: 0 0 15px #4caf50; }
        .corner-btn.wrong { background-color: #f44336 !important; box-shadow: 0 0 15px #f44336; }
        #btn-0 { top: 10px; left: 127px; }
        #btn-1 { top: 110px; right: 10px; }
        #btn-2 { bottom: 20px; right: 50px; }
        #btn-3 { bottom: 20px; left: 50px; }
        #btn-4 { top: 110px; left: 10px; }
        .btn-next { display: inline-block; padding: 12px 35px; background-color: #4caf50; color: white; border: none; border-radius: 8px; font-size: 1.2rem; font-weight: bold; cursor: pointer; margin-top: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn-next:hover { background-color: #43a047; }
        .result-box { margin-top: 20px; min-height: 50px; }
        .score-board { font-size: 1.1rem; margin-top: 10px; color: #666; font-weight: bold; }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>🛑 เกมปริศนาห้าเหลี่ยมสุ่มโจทย์อนันต์</h1>
        <p class="instructions">
            <b>คำชี้แจง:</b> สังเกตตัวเลขทั้ง 5 มุมให้ดี มีตัวเลขบางตัวที่เป็น <b>"ผลบวกของตัวเลขอื่นอีก 2 ตัว"</b> ลองหาให้เจอแล้วจิ้มตัวเลขนั้นเลยจ้า! (ระบบสุ่มเลขไม่ซ้ำเล่นได้เรื่อยๆ)
        </p>
        
        <div class="pentagon-area">
            <div class="pentagon-shape"></div>
            <div class="corner-btn" id="btn-0" onclick="guessNumber(0)"></div>
            <div class="corner-btn" id="btn-1" onclick="guessNumber(1)"></div>
            <div class="corner-btn" id="btn-2" onclick="guessNumber(2)"></div>
            <div class="corner-btn" id="btn-3" onclick="guessNumber(3)"></div>
            <div class="corner-btn" id="btn-4" onclick="guessNumber(4)"></div>
        </div>

        <div class="result-box" id="result-message"></div>
        <div class="score-board" id="score-board">คะแนน: 0 | ข้อที่: 1</div>
    </div>

    <script>
        let currentLevel = 1;
        let score = 0;
        let canGuess = true;
        let currentLevelData = [];

        // 🎲 ฟังก์ชันสำหรับสุ่มตัวเลขแบบสุ่มสดขอบเขตไม่เกิน 100
        function generateRandomQuestion() {
            let part1, part2, whole;
            
            // วนลูปสุ่มจนกว่าจะได้ผลรวมไม่เกิน 100
            while (true) {
                part1 = Math.floor(Math.random() * 45) + 2; // เลขเริ่มต้นตัวที่ 1 (2-46)
                part2 = Math.floor(Math.random() * 45) + 2; // เลขเริ่มต้นตัวที่ 2 (2-46)
                whole = part1 + part2;
                if (whole <= 100 && part1 !== part2) break;
            }

            // สุ่มสร้างเลขหลอกอีก 2 ตัวที่ไม่ซ้ำกับตัวเลขหลัก
            let fake1, fake2;
            while (true) {
                fake1 = Math.floor(Math.random() * 90) + 5;
                fake2 = Math.floor(Math.random() * 90) + 5;
                if (fake1 !== part1 && fake1 !== part2 && fake1 !== whole && 
                    fake2 !== part1 && fake2 !== part2 && fake2 !== whole && fake1 !== fake2) {
                    break;
                }
            }

            // ประกอบร่างเลขทั้ง 5 ตัวแล้วสั่งสลับมุมกระจายตัว
            let rawNums = [part1, part2, whole, fake1, fake2];
            return rawNums.sort(() => Math.random() - 0.5);
        }

        // เปิดฉากดึงโจทย์สุ่มขึ้นมาแสดงผล
        function initGame() {
            document.getElementById('result-message').innerHTML = "";
            canGuess = true;

            document.getElementById('score-board').innerText = "คะแนน: " + score + " | ข้อที่: " + currentLevel;

            // เรียกฟังก์ชันสุ่มสดหน้างาน
            currentLevelData = generateRandomQuestion();

            for (let i = 0; i < 5; i++) {
                const btn = document.getElementById("btn-" + i);
                btn.innerText = currentLevelData[i];
                btn.className = "corner-btn";
                btn.setAttribute("data-value", currentLevelData[i]); // ผูกค่าตรวจสด
            }
        }

        // 🧠 ระบบตรวจคำตอบแบบตรวจสด (Dynamic Checking) ทุกทิศทาง
        function guessNumber(index) {
            if (!canGuess) return;

            const btn = document.getElementById("btn-" + index);
            const clickedNum = parseInt(btn.getAttribute("data-value"));
            
            // แยกตัวเลขฝั่งตรงข้ามอีก 4 ตัวออกมาวิเคราะห์
            let remainingNums = [];
            for (let i = 0; i < 5; i++) {
                if (i !== index) {
                    const otherBtn = document.getElementById("btn-" + i);
                    remainingNums.push(parseInt(otherBtn.getAttribute("data-value")));
                }
            }

            // จับคู่คำนวณสดทันทีว่ามีตัวไหนในกลุ่มบวกกันได้ค่าเท่ากับตัวที่กดหรือไม่
            let isCorrect = false;
            let foundNote = "";

            for (let i = 0; i < remainingNums.length; i++) {
                for (let j = i + 1; j < remainingNums.length; j++) {
                    if (remainingNums[i] + remainingNums[j] === clickedNum) {
                        isCorrect = true;
                        foundNote = remainingNums[i] + " + " + remainingNums[j] + " = " + clickedNum;
                        break;
                    }
                }
                if (isCorrect) break;
            }

            if (isCorrect) {
                btn.classList.add('correct');
                score += 10;
                document.getElementById('score-board').innerText = "คะแนน: " + score + " | ข้อที่: " + currentLevel;
                canGuess = false;

                document.getElementById('result-message').innerHTML = 
                    "<div style='background-color: #e8f5e9; border: 2px solid #2e7d32; padding: 15px; border-radius: 12px; color: #1b5e20; font-weight: bold; font-size: 1.15rem;'>" +
                        "🎉 ถูกต้องแล้วจ้า! ตัวเลขคำตอบคือ " + clickedNum + "<br>" +
                        "💡 ความสัมพันธ์ที่ระบบตรวจเจอสดๆ คือ: <span style='background-color: #ffeb3b; padding: 2px 6px; border-radius: 4px; color: #d32f2f;'>" + foundNote + "</span>" +
                        "<div style='margin-top: 10px;'><button class='btn-next' onclick='nextLevel()'>ข้อถัดไป ➡️</button></div>" +
                    "</div>";
            } else {
                btn.classList.add('wrong');
                document.getElementById('result-message').innerHTML = 
                    "<div style='background-color: #ffebee; border: 2px solid #c62828; padding: 12px; border-radius: 10px; color: #c62828; font-weight: bold;'>" +
                        "❌ ยังไม่ถูกนะจ๊ะ ลองเอาตัวเลขมุมอื่นจับคู่บวกกันดูอีกทีนะ!" +
                    "</div>";
            }
        }

        // ปุ่มกดข้ามข้อแบบสุ่มโจทย์ใหม่ขึ้นมาไม่มีที่สิ้นสุด
        function nextLevel() {
            currentLevel++;
            initGame(); // สุ่มโจทย์ใหม่ขึ้นมาทันทีรัวๆ
        }

        window.onload = initGame;
    </script>
