<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pentagon Math Game</title>
    <style>
        body { font-family: sans-serif; background-color: #f0f4f8; margin: 0; padding: 20px; text-align: center; user-select: none; }
        .game-container { max-width: 600px; margin: 10px auto; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 8px 16px rgba(0,0,0,0.1); }
        h1 { color: #1565c0; margin-bottom: 5px; font-size: 1.8rem; }
        .instructions { color: #555; font-size: 0.95rem; margin-bottom: 25px; line-height: 1.5; }
        .pentagon-area { position: relative; width: 320px; height: 320px; margin: 0 auto 30px auto; background-color: #fafafa; border-radius: 50%; border: 2px dashed #cfd8dc; }
        .pentagon-shape { position: absolute; width: 180px; height: 180px; background: #e3f2fd; clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%); top: 70px; left: 70px; border: 2px solid #90caf9; z-index: 1; }
        .corner-btn { position: absolute; width: 65px; height: 65px; background-color: #2196f3; color: white; border-radius: 50%; font-size: 1.6rem; font-weight: bold; display: flex; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 4px 8px rgba(0,0,0,0.2); transition: 0.2s; z-index: 10; border: 3px solid white; -webkit-tap-highlight-color: transparent; }
        .corner-btn:active { transform: scale(0.9); }
        .corner-btn.correct { background-color: #4caf50 !important; box-shadow: 0 0 15px #4caf50; }
        .corner-btn.wrong { background-color: #f44336 !important; box-shadow: 0 0 15px #f44336; }
        #btn-0 { top: 10px; left: 127px; }
        #btn-1 { top: 110px; right: 10px; }
        #btn-2 { bottom: 20px; right: 50px; }
        #btn-3 { bottom: 20px; left: 50px; }
        #btn-4 { top: 110px; left: 10px; }
        .btn-next { display: inline-block; padding: 12px 35px; background-color: #4caf50; color: white; border: none; border-radius: 8px; font-size: 1.2rem; font-weight: bold; cursor: pointer; margin-top: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn-next:hover { background-color: #43a047; }
        .result-box { margin-top: 20px; min-height: 50px; }
        .score-board { font-size: 1.1rem; margin-top: 10px; color: #666; font-weight: bold; }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>🛑 เกมบวกเลขมุมห้าเหลี่ยม</h1>
        <p class="instructions">
            <b>คำชี้แจง:</b> สังเกตตัวเลขทั้ง 5 มุมให้ดี มีตัวเลขอยู่ 1 ตัวที่เป็น <b>"ผลบวกของตัวเลขอื่นอีก 2 ตัว"</b> ลองหาให้เจอแล้วจิ้มตัวเลขนั้นเลยจ้า!
        </p>
        
        <div class="pentagon-area">
            <div class="pentagon-shape"></div>
            <div class="corner-btn" id="btn-0" onclick="guessNumber(0)"></div>
            <div class="corner-btn" id="btn-1" onclick="guessNumber(1)"></div>
            <div class="corner-btn" id="btn-2" onclick="guessNumber(2)"></div>
            <div class="corner-btn" id="btn-3" onclick="guessNumber(3)"></div>
            <div class="corner-btn" id="btn-4" onclick="guessNumber(4)"></div>
        </div>

        <div class="result-box" id="result-message"></div>
        <div class="score-board" id="score-board">คะแนน: 0 | ข้อที่: 1 / 5</div>
    </div>

    <script>
        // 💡 ปรับวิธีเขียนใหม่: แยกตัวเลขกระจายออกจากกันตรงๆ ไม่มีวงเล็บเหลี่ยมซ้อนแล้วครับ
            // 💡 แก้ไขตัวเลขข้อ 3 และ 5 ใหม่ เพื่อให้มีคำตอบที่ถูกเพียงคำตอบเดียวชัวร์ๆ ครับครู
    const questions = [
        { a: 20, b: 15, c: 35, d: 40, e: 11, ans: 35, note: "20 + 15 = 35" },
        { a: 12, b: 38, c: 50, d: 22, e: 44, ans: 50, note: "12 + 38 = 50" },
        { a: 9,  b: 16, c: 25, d: 44, e: 11, ans: 25, note: "9 + 16 = 25" }, // เปลี่ยน 14 เป็น 44, เปลี่ยน 30 เป็น 11
        { a: 33, b: 14, c: 47, d: 55, e: 21, ans: 47, note: "33 + 14 = 47" },
        { a: 18, b: 72, c: 90, d: 41, e: 35, ans: 90, note: "18 + 72 = 90" }  // เปลี่ยน 10 เป็น 41, เปลี่ยน 85 เป็น 35
    ];


        let currentLevel = 0;
        let score = 0;
        let canGuess = true;
        let currentLevelData = [];

        function initGame() {
            document.getElementById('result-message').innerHTML = "";
            canGuess = true;

            const q = questions[currentLevel];
            document.getElementById('score-board').innerText = "คะแนน: " + score + " | ข้อที่: " + (currentLevel + 1) + " / " + questions.length;

            // รวมตัวเลขเข้ากระบวนการสลับตำแหน่งแบบอัตโนมัติเบื้องหลัง
            currentLevelData = [q.a, q.b, q.c, q.d, q.e].sort(() => Math.random() - 0.5);

            for (let i = 0; i < 5; i++) {
                const btn = document.getElementById("btn-" + i);
                btn.innerText = currentLevelData[i];
                btn.className = "corner-btn";
            }
        }

        function guessNumber(index) {
            if (!canGuess) return;

            const clickedNum = currentLevelData[index];
            const q = questions[currentLevel];
            const btn = document.getElementById("btn-" + index);

            if (clickedNum === q.ans) {
                btn.classList.add('correct');
                score += 10;
                document.getElementById('score-board').innerText = "คะแนน: " + score + " | ข้อที่: " + (currentLevel + 1) + " / " + questions.length;
                canGuess = false;

                document.getElementById('result-message').innerHTML = 
                    "<div style='background-color: #e8f5e9; border: 2px solid #2e7d32; padding: 15px; border-radius: 12px; color: #1b5e20; font-weight: bold; font-size: 1.15rem;'>" +
                        "🎉 ถูกต้องแล้วจ้า! ตัวเลขคำตอบคือ " + q.ans + "<br>" +
                        "💡 ความสัมพันธ์คือ: <span style='background-color: #ffeb3b; padding: 2px 6px; border-radius: 4px; color: #d32f2f;'>" + q.note + "</span> นั่นเอง!" +
                        "<div style='margin-top: 10px;'><button class='btn-next' onclick='nextLevel()'>ข้อถัดไป ➡️</button></div>" +
                    "</div>";
            } else {
                btn.classList.add('wrong');
                document.getElementById('result-message').innerHTML = 
                    "<div style='background-color: #ffebee; border: 2px solid #c62828; padding: 12px; border-radius: 10px; color: #c62828; font-weight: bold;'>" +
                        "❌ ยังไม่ถูกนะจ๊ะ ลองเอาตัวเลขอื่นจับคู่บวกกันดูอีกทีนะน้า!" +
                    "</div>";
            }
        }

        function nextLevel() {
            currentLevel++;
            if (currentLevel < questions.length) {
                initGame();
            } else {
                document.querySelector('.pentagon-area').style.opacity = "0.3";
                document.getElementById('result-message').innerHTML = 
                    "<div style='background: #fff3cd; padding: 20px; border-radius: 15px; font-size: 1.25rem; border: 2px solid #ffeeba; color: #856404; font-weight: bold;'>" +
                        "🏆 ยอดเยี่ยมที่สุดเด็กๆ! ค้นหาผลบวกมุมห้าเหลี่ยมครบหมดแล้ว<br>" +
                        "ได้คะแนนรวมทั้งหมด 🌟 " + score + " คะแนนเต็ม 🌟" +
                    "</div>";
            }
        }

        window.onload = initGame;
    </script>
</body>
</html>
