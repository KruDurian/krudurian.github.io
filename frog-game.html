<div class="frog-game-container">
    <!-- ส่วนหัวเกม -->
    <div class="game-header">
        <h2>🪷 เกมเจ้ากบกระโดดข้ามใบบัว 🐸</h2>
        <p>ฝึกทักษะการเรียงลำดับตัวเลข (น้อยไปมาก หรือ มากไปน้อย)</p>
    </div>

    <!-- ฉากการเดินทาง (Visual Map ในสระน้ำ) -->
    <div class="game-scene">
        <div class="path-grid" id="frog-path">
            <!-- จุดเริ่มต้น: เจ้ากบ -->
            <div class="path-cell start-cell" id="fcell-0">🐸</div>
            <!-- ใบบัวที่ซ่อนอยู่ใต้เง่น้ำ -->
            <div class="path-cell locked" id="fcell-1">🍃</div>
            <div class="path-cell locked" id="fcell-2">🍃</div>
            <div class="path-cell locked" id="fcell-3">🍃</div>
            <div class="path-cell locked" id="fcell-4">🍃</div>
            <!-- จุดหมาย: ดอกบัว -->
            <div class="path-cell target-cell" id="fcell-5">🪷</div>
        </div>
    </div>

    <!-- กล่องโจทย์คำถามคำสั่งเรียงเลข -->
    <div class="quiz-box">
        <div class="level-indicator">ใบบัวที่ข้ามผ่าน: <span id="frog-step">0</span> / 5</div>
        <div class="game-mission" id="frog-mission">กำลังสุ่มคำสั่ง...</div>
        
        <!-- ตัวเลขสุ่ม 3 ตัวที่ให้เด็กๆ กดคลิกเพื่อเรียงลำดับ -->
        <div class="number-buttons-zone" id="number-options">
            <!-- ปุ่มตัวเลขจะถูกสร้างขึ้นอัตโนมัติด้วย JavaScript -->
        </div>

        <!-- แถบแสดงคำตอบที่เด็กเลือกกดเรียงไว้ -->
        <div class="your-answer-bar">
            <span>คำตอบของหนู:</span>
            <div class="answer-slots" id="answer-slots"></div>
        </div>
        
        <!-- ปุ่มกดยืนยันคำตอบ และล้างค่า -->
        <div class="action-btn-zone">
            <button type="button" class="clear-btn" onclick="clearFrogAnswer()">ล้างคำตอบ 🔄</button>
            <button type="button" class="submit-btn" onclick="checkFrogAnswer()">ส่งคำตอบ 🌟</button>
        </div>
        
        <!-- ข้อความแจ้งสถานะและปุ่มเริ่มใหม่ -->
        <div id="frog-feedback" class="game-feedback"></div>
        <div id="frog-victory" style="display:none; text-align:center; margin-top:15px;">
            <button type="button" class="restart-btn" onclick="resetFrogGame()">เล่นใหม่อีกครั้ง 🔄</button>
        </div>
    </div>
</div>

<!-- ระบบควบคุมเกมกบกระโดดข้ามใบบัวและตรวจการเรียงลำดับเลข -->
<script>
let frogStep = 0;
const fTotalSteps = 5;
let originalNumbers = [];
let userSelections = [];
let isLessToMore = true; // true = น้อยไปมาก, false = มากไปน้อย
let fCorrectOrder = [];

// ฟังก์ชันเริ่มต้นและสุ่มโจทย์ใหม่
function generateFrogQuestion() {
    userSelections = [];
    document.getElementById('answer-slots').innerHTML = '';
    
    // 1. สุ่มเลือกคำสั่ง (น้อยไปมาก หรือ มากไปน้อย)
    isLessToMore = Math.random() > 0.5;
    const missionText = isLessToMore ? "🟢 จงเรียงลำดับตัวเลขจาก [ น้อย ➡️ มาก ]" : "🔵 จงเรียงลำดับตัวเลขจาก [ มาก ➡️ น้อย ]";
    document.getElementById('frog-mission').innerHTML = missionText;

    // 2. สุ่มตัวเลข 3 ตัวไม่ซ้ำกัน (ช่วง 1 - 30)
    originalNumbers = [];
    while(originalNumbers.length < 3) {
        let r = Math.floor(Math.random() * 30) + 1;
        if(originalNumbers.indexOf(r) === -1) originalNumbers.push(r);
    }

    // 3. คำนวณคำตอบที่ถูกต้องตามคำสั่ง
    fCorrectOrder = [...originalNumbers];
    if (isLessToMore) {
        fCorrectOrder.sort((a, b) => a - b); // น้อยไปมาก
    } else {
        fCorrectOrder.sort((a, b) => b - a); // มากไปน้อย
    }

    // 4. สร้างปุ่มตัวเลขให้เด็กๆ คลิก (สุ่มสลับตำแหน่งปุ่มเพื่อความท้าทาย)
    let displayNumbers = [...originalNumbers].sort(() => Math.random() - 0.5);
    let optionsHtml = '';
    displayNumbers.forEach(num => {
        optionsHtml += `<button type="button" class="num-choice-btn" id="num-btn-${num}" onclick="selectFrogNumber(${num})">${num}</button>`;
    });
    document.getElementById('number-options').innerHTML = optionsHtml;
    document.getElementById('frog-feedback').innerHTML = '';
}

// ฟังก์ชันเมื่อเด็กๆ คลิกเลือกตัวเลข
function selectFrogNumber(num) {
    // ป้องกันการกดตัวเลขซ้ำที่เลือกไปแล้ว
    if (userSelections.includes(num)) return;

    userSelections.push(num);
    
    // ซ่อนปุ่มที่ถูกกดไปแล้ว
    document.getElementById(`num-btn-${num}`).style.visibility = 'hidden';

    // แสดงตัวเลขในช่องคำตอบของหนู
    const slots = document.getElementById('answer-slots');
    slots.innerHTML += `<div class="ans-slot-item">${num}</div>`;
}

// ฟังก์ชันล้างค่าเพื่อเลือกใหม่ในข้อนั้นๆ
function clearFrogAnswer() {
    userSelections = [];
    document.getElementById('answer-slots').innerHTML = '';
    
    // แสดงปุ่มตัวเลขทั้งหมดกลับคืนมา
    const buttons = document.querySelectorAll('.num-choice-btn');
    buttons.forEach(btn => {
        btn.style.visibility = 'visible';
    });
    document.getElementById('frog-feedback').innerHTML = '';
}

// ฟังก์ชันตรวจคำตอบ
function checkFrogAnswer() {
    const feedback = document.getElementById('frog-feedback');
    
    if (userSelections.length < 3) {
        feedback.innerHTML = "⚠️ หนูๆ ต้องกดเลือกตัวเลขให้ครบทั้ง 3 ตัวก่อนนะจ๊ะ";
        feedback.className = "game-feedback warning";
        return;
    }

    // ตรวจสอบอาร์เรย์คำตอบว่าตรงกันทุกตำแหน่งไหม
    let isCorrect = true;
    for (let i = 0; i < 3; i++) {
        if (userSelections[i] !== fCorrectOrder[i]) {
            isCorrect = false;
            break;
        }
    }

    if (isCorrect) {
        frogStep++;
        feedback.innerHTML = "🎉 เก่งมากจ้า! เรียงลำดับถูกต้อง 🐸 อ๊บๆ กระโดดแล้ว!";
        feedback.className = "game-feedback success";
        
        updateFrogMap();
        
        if (frogStep >= fTotalSteps) {
            endFrogGame();
        } else {
            // ไปข้อต่อไปหลังผ่านไป 1.5 วินาที
            setTimeout(generateFrogQuestion, 1500);
        }
    } else {
        feedback.innerHTML = "❌ ยังเรียงไม่ถูกต้องนะจ๊ะ ลองกดล้างคำตอบแล้วเรียงใหม่อีกทีนะ";
        feedback.className = "game-feedback error";
    }
}

// ฟังก์ชันขยับเจ้ากบในบ่อน้ำ
function updateFrogMap() {
    document.getElementById('frog-step').innerText = frogStep;
    
    const prevCell = document.getElementById(`fcell-${frogStep - 1}`);
    if (prevCell) prevCell.innerHTML = "🌊"; // เปลี่ยนรอยเท้าเก่าเป็นน้ำ

    const currentCell = document.getElementById(`fcell-${frogStep}`);
    if (currentCell) {
        currentCell.innerHTML = "🐸";
        currentCell.className = "path-cell f-active-path";
    }
}

// ฟังก์ชันเมื่อชนะเกม (ถึงดอกบัว)
function endFrogGame() {
    document.getElementById('frog-mission').innerHTML = "🥳 เย้! เจ้ากบกระโดดมาถึงดอกบัวแสนสวยและปลอดภัยแล้วจ้า! 🪷🐸✨";
    document.getElementById('number-options').innerHTML = '';
    document.querySelector('.frog-game-container .action-btn-zone').style.display = 'none';
    document.getElementById('frog-victory').style.display = 'block';
    
    document.getElementById(`fcell-${fTotalSteps}`).innerHTML = "🐸🪷";
}

// ฟังก์ชันรีเซ็ตเกมเริ่มใหม่ตั้งแต่ศูนย์
function resetFrogGame() {
    frogStep = 0;
    document.getElementById('frog-step').innerText = frogStep;
    document.querySelector('.frog-game-container .action-btn-zone').style.display = 'flex';
    document.getElementById('frog-victory').style.display = 'none';
    document.getElementById('frog-feedback').innerHTML = '';
    
    document.getElementById('fcell-0').innerHTML = "🐸";
    document.getElementById('fcell-0').className = "path-cell start-cell";
    
    for (let i = 1; i < fTotalSteps; i++) {
        document.getElementById(`fcell-${i}`).innerHTML = "🍃";
        document.getElementById(`fcell-${i}`).className = "path-cell locked";
    }
    
    document.getElementById(`fcell-${fTotalSteps}`).innerHTML = "🪷";
    document.getElementById(`fcell-${fTotalSteps}`).className = "path-cell target-cell";
    
    generateFrogQuestion();
}

// ให้ระบบรันเกมอัตโนมัติ
setTimeout(resetFrogGame, 300);
</script>
