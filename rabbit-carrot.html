<div class="math-game-container">
    <!-- ส่วนหัวเกม -->
    <div class="game-header">
        <h2>🥕 เกมกระต่ายน้อยเดินทางไปกินแครอท 🐰</h2>
        <p>ฝึกทักษะการบวก-ลบเลขไม่เกิน 20 (ตอบถูกเพื่อเปิดทางไปต่อ)</p>
    </div>

    <!-- ฉากการเดินทาง (Visual Map) -->
    <div class="game-scene">
        <div class="path-grid" id="game-path">
            <!-- จุดเริ่มต้น: กระต่าย -->
            <div class="path-cell start-cell" id="cell-0">🐰</div>
            <!-- ทางเดินที่ถูกปิดไว้ในตอนแรก -->
            <div class="path-cell locked" id="cell-1">🪵</div>
            <div class="path-cell locked" id="cell-2">🪵</div>
            <div class="path-cell locked" id="cell-3">🪵</div>
            <div class="path-cell locked" id="cell-4">🪵</div>
            <!-- จุดหมาย: แครอท -->
            <div class="path-cell target-cell" id="cell-5">🥕</div>
        </div>
    </div>

    <!-- กล่องโจทย์คำถามอินเตอร์แอคทีฟ -->
    <div class="quiz-box">
        <div class="level-indicator">ก้าวที่เอาชนะ: <span id="current-step">0</span> / 5</div>
        <div class="math-question" id="question-text">กำลังโหลดโจทย์...</div>
        
        <!-- ช่องใส่คำตอบสำหรับเด็กๆ -->
        <div class="answer-zone">
            <input type="number" id="user-answer" placeholder="พิมพ์คำตอบที่นี่" min="0" max="20" autofocus>
            <button type="button" class="submit-btn" onclick="checkGameAnswer()">ส่งคำตอบ 🌟</button>
        </div>
        
        <!-- ข้อความแจ้งสถานะและปุ่มเริ่มใหม่ -->
        <div id="game-feedback" class="game-feedback"></div>
        <div id="victory-zone" style="display:none; text-align:center; margin-top:15px;">
            <button type="button" class="restart-btn" onclick="resetGame()">เล่นใหม่อีกครั้ง 🔄</button>
        </div>
    </div>
</div>

<!-- ระบบควบคุมเกมและตรวจคำตอบสุ่มโจทย์ -->
<script>
let currentStep = 0;
const totalSteps = 5;
let num1 = 0;
let num2 = 0;
let operator = '+';
let correctAnswer = 0;

// ฟังก์ชันสุ่มโจทย์บวก-ลบ ไม่เกิน 20
function generateGameQuestion() {
    // สุ่มเลือกว่าจะเป็นเครื่องหมายบวก (+) หรือ ลบ (-)
    operator = Math.random() > 0.5 ? '+' : '-';
    
    if (operator === '+') {
        // การบวก: ผลรวมต้องไม่เกิน 20
        correctAnswer = Math.floor(Math.random() * 21); // 0 ถึง 20
        num1 = Math.floor(Math.random() * (correctAnswer + 1));
        num2 = correctAnswer - num1;
    } else {
        // การลบ: ตัวตั้งต้องไม่เกิน 20 และผลลัพธ์ไม่ติดลบ
        num1 = Math.floor(Math.random() * 16) + 5; // 5 ถึง 20
        num2 = Math.floor(Math.random() * (num1 + 1));
        correctAnswer = num1 - num2;
    }

    // แสดงโจทย์บนหน้าจอ
    document.getElementById('question-text').innerHTML = `${num1} ${operator} ${num2} = ?`;
    document.getElementById('user-answer').value = '';
    document.getElementById('user-answer').focus();
}

// ฟังก์ชันตรวจคำตอบและขยับตัวละคร
function checkGameAnswer() {
    const userAnswer = parseInt(document.getElementById('user-answer').value);
    const feedback = document.getElementById('game-feedback');
    
    if (isNaN(userAnswer)) {
        feedback.innerHTML = "⚠️ หนูๆ อย่าลืมพิมพ์คำตอบก่อนนะจ๊ะ";
        feedback.className = "game-feedback warning";
        return;
    }

    if (userAnswer === correctAnswer) {
        currentStep++;
        feedback.innerHTML = "🎉 เก่งมากเลย! ตอบถูกแล้วจ้า 🐰 กระโดดข้ามไปได้!";
        feedback.className = "game-feedback success";
        
        // อัปเดตตำแหน่งกระต่ายและการเปิดทางบนแมพ
        updateGameMap();
        
        // ตรวจสอบว่าถึงแครอทหรือยัง
        if (currentStep >= totalSteps) {
            endGameVictory();
        } else {
            // สุ่มโจทย์ข้อต่อไปหลังผ่านไป 1.5 วินาที เพื่อให้เด็กดูอนิเมชั่นขยับก่อน
            setTimeout(generateGameQuestion, 1500);
        }
    } else {
        feedback.innerHTML = "❌ ยังไม่ถูกนะจ๊ะ ลองนับนิ้วใหม่อีกรอบสิคนเก่ง";
        feedback.className = "game-feedback error";
    }
}

// ฟังก์ชันอัปเดตแผนที่เกม ขยับกระต่ายและเปิดทาง
function updateGameMap() {
    document.getElementById('current-step').innerText = currentStep;
    
    // ล้างตำแหน่งเก่าของกระต่ายในช่องก่อนหน้าให้กลายเป็นพื้นว่าง
    const prevCell = document.getElementById(`cell-${currentStep - 1}`);
    if (prevCell) prevCell.innerHTML = "🟩";

    // ขยับกระต่ายไปยังช่องปัจจุบัน และเปิดขอนไม้ออก
    const currentCell = document.getElementById(`cell-${currentStep}`);
    if (currentCell) {
        currentCell.innerHTML = "🐰";
        currentCell.className = "path-cell active-path";
    }
}

// ฟังก์ชันเมื่อชนะเกม (กินแครอทสำเร็จ)
function endGameVictory() {
    document.getElementById('question-text').innerHTML = "🥳 ไชโย! เจ้ากระต่ายได้กินแครอทอิ่มอร่อยแล้วจ้า! 🥕🐰✨";
    document.getElementById('user-answer').style.display = 'none';
    document.querySelector('.submit-btn').style.display = 'none';
    document.getElementById('victory-zone').style.display = 'block';
    
    // เปลี่ยนช่องแครอทให้เป็นกระต่ายกินแครอท
    document.getElementById(`cell-${totalSteps}`).innerHTML = "🐰🥕";
}

// ฟังก์ชันรีเซ็ตระบบเพื่อเริ่มเล่นใหม่
function resetGame() {
    currentStep = 0;
    document.getElementById('current-step').innerText = currentStep;
    document.getElementById('user-answer').style.display = 'inline-block';
    document.querySelector('.submit-btn').style.display = 'inline-block';
    document.getElementById('victory-zone').style.display = 'none';
    document.getElementById('game-feedback').innerHTML = '';
    
    // รีเซ็ตหน้าตากล่องตารางแมพใหม่ทั้งหมด
    document.getElementById('cell-0').innerHTML = "🐰";
    document.getElementById('cell-0').className = "path-cell start-cell";
    
    for (let i = 1; i < totalSteps; i++) {
        document.getElementById(`cell-${i}`).innerHTML = "🪵";
        document.getElementById(`cell-${i}`).className = "path-cell locked";
    }
    
    document.getElementById(`cell-${totalSteps}`).innerHTML = "🥕";
    document.getElementById(`cell-${totalSteps}`).className = "path-cell target-cell";
    
    generateGameQuestion();
}

// เรียกให้เกมทำงานทันทีเมื่อโหลดหน้าเว็บ
setTimeout(resetGame, 300);
</script>
