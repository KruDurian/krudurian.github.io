<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บล็อกใหม่ของ KruDurian - ย้ายบ้านจาก Blogspot</title>
    <meta name="description" content="บล็อกแชร์เรื่องราวและทดสอบระบบ JavaScript บน GitHub Pages ของครูทุเรียน">
</head>
<body>

    <header style="text-align: center; padding: 30px; background: #e2f0d9; border-bottom: 3px solid #385723;">
        <h1>ยินดีต้อนรับสู่บล็อกใหม่บน GitHub Pages ของ KruDurian! 🏆</h1>
    </header>

    <main style="max-width: 800px; margin: 30px auto; padding: 0 20px; font-family: sans-serif; line-height: 1.6;">
        <article>
            <h2>บล็อกนี้รองรับ HTML และ JavaScript 100%</h2>
            <p>นี่คือเนื้อหาทดสอบภาษาไทย ระบบนี้โหลดเร็วมาก โครงสร้างสะอาด และไม่มีปัญหา Redirect Error กวนใจแน่นอนครับ</p>
            
            <!-- ส่วนทดสอบสคริปต์ JavaScript -->
            <div id="js-test-box" style="padding: 20px; background: #fff2cc; border: 1px solid #d6b656; border-radius: 5px; margin-top: 20px;">
                กำลังโหลดระบบสคริปต์...
            </div>

            <script>
                // สคริปต์จะทำงานทันทีเมื่อเปิดหน้าเว็บ
                document.getElementById('js-test-box').innerHTML = "<b>🔥 ข้อความนี้เขียนด้วย JavaScriptสำเร็จแล้ว!</b> สคริปต์ทำงานได้อิสระ 100% ไม่มีระบบแพลตฟอร์มมาบล็อกหรือจำกัดโค้ดของคุณอีกต่อไปครับ";
            </script>
        </article>
    </main>

</body>
</html>
